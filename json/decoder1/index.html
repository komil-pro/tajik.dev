<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <title>Декодер JSON</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px 16px;
      color: #111;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #1e40af;
      margin: 0 0 1.2rem 0;
      font-size: 1.8rem;
    }
    .buttons {
      margin: 1.2rem 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary   { background: #2563eb; color: white; }
    .btn-primary:hover   { background: #1d4ed8; }
    .btn-secondary { background: #6b7280; color: white; }
    .btn-secondary:hover { background: #4b5563; }
    .panel {
      margin-bottom: 1.8rem;
    }
    .panel label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
      color: #374151;
    }
    textarea, pre {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      width: 100%;
      min-height: 380px;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      resize: vertical;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
      white-space: pre-wrap;
      overflow-x: auto;
      box-sizing: border-box;
    }
    pre {
      background: #f1f5f9;
      border-color: #cbd5e1;
      margin: 0;
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 6px 12px;
      font-size: 13px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #047857; }
    .error {
      color: #dc2626;
      font-weight: 500;
      margin-top: 0.8rem;
      min-height: 1.3em;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Декодер экранированного JSON (пример из Redis)</h1>

  <div class="buttons">
    <button class="btn-primary" id="decodeBtn">Разобрать</button>
    <button class="btn-secondary" id="clearBtn">Очистить</button>
  </div>

  <div class="panel">
    <label>Ввод:</label>
    <textarea id="input" placeholder="Вставьте сюда строку..."></textarea>
  </div>

  <div class="panel">
    <label>Результат (нормальный JSON):</label>
    <div style="position: relative;">
      <pre id="output">Ожидаю данные...</pre>
      <button class="copy-btn" id="copyBtn" style="display:none;">Скопировать</button>
    </div>
  </div>

  <div id="error" class="error"></div>
</div>

<script src="decoder.js"></script>

</body>
</html>
